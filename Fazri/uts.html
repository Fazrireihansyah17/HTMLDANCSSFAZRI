<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Fazri Reihansyah</title>
  <link rel="stylesheet" href="uts.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" 
  rel="stylesheet">
   <link rel="icon" href="ajiaji.png" type="image/png">
</head>
<body>
  <div class="page-background">
    <main class="login-card">
      <button type="button" class="close-btn" aria-label="Close modal">&times;</button>
      
      <section class="branding-section">
        <div class="branding-header">
          <span class="brand-name">Fazri Workspace.</span>
        </div>
        
        <div class="welcome-text">
          <h2>Welcome Back!</h2>
          <p>Nice to see you again</p>
        </div>

        <div class="peeking-container">
          <img src="ajiaji.png" alt="Fazri Anime Character" class="peeking-img">
        </div>
      </section>

      <section class="form-section">
        <div class="form-wrapper">
          <h1 class="form-title">Login</h1>

          <form class="login-form" action="#" method="POST">
            <div class="form-group">
              <label for="email">Email</label>
              <div class="input-with-icon">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
                <input type="email" id="email" name="email" placeholder="nama@email.com" required autocomplete="email">
              </div>
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <div class="input-with-icon">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
              </div>
              <div class="forgot-wrapper">
                <a href="#" class="forgot-link">Forgot Password?</a>
              </div>
            </div>

            <button type="submit" class="btn-submit">Log In</button>

            <div class="divider">
              <span>Or Continue With</span>
            </div>

            <div class="sso-group">
              <button type="button" class="sso-btn" aria-label="Sign in with Google">
                <svg viewBox="0 0 24 24" width="20" height="20">
                  <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                  <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                  <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                  <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                </svg>
              </button>
              <button type="button" class="sso-btn" aria-label="Sign in with Facebook">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="#1877F2">
                  <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
              </button>
              <button type="button" class="sso-btn" aria-label="Sign in with Apple">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="#000000">
                  <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.12-1.96.99-3.1-.97.04-2.14.65-2.83 1.46-.61.72-1.15 1.88-.99 3 1.08.08 2.16-.54 2.83-1.36z"/>
                </svg>
              </button>
            </div>

            <p class="register-text">
              Don't have an account? <a href="#">Sign Up here</a>
            </p>
          </form>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
